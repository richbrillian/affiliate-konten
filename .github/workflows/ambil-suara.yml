name: Ambil suara render ulang
on:
  push:
    paths: ['.github/workflows/ambil-suara.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd suara-render-ulang
          while read -r no url; do
            [ -z "$no" ] && continue
            [ -s "$no.mp3" ] && continue
            curl -fsSL -o "$no.mp3" "$url" \
              && echo "OK $no" || { echo "GAGAL $no"; rm -f "$no.mp3"; }
          done < urls.txt
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add suara-render-ulang/*.mp3
          git diff --cached --quiet || (git commit -m "Suara render ulang" && git push)
