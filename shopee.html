<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antrian Shopee Video</title>
<style>
  :root{--o:#ee4d2d;--bg:#f6f6f6;--card:#fff;--tx:#222;--mut:#777}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
  header{position:sticky;top:0;background:var(--o);color:#fff;padding:12px 14px;z-index:2}
  header h1{margin:0;font-size:18px}
  header p{margin:4px 0 0;font-size:13px;opacity:.9}
  .tabs{display:flex;gap:6px;margin-top:8px}
  .tabs button{flex:1;border:0;border-radius:8px;padding:8px;font-weight:600;background:rgba(255,255,255,.25);color:#fff}
  .tabs button.on{background:#fff;color:var(--o)}
  main{padding:10px;max-width:560px;margin:auto}
  .card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .top{display:flex;gap:10px;align-items:center}
  .top img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none}
  .kode{font-size:12px;color:var(--o);font-weight:700}
  .nama{font-size:14px;font-weight:600;line-height:1.3}
  video{width:100%;max-height:360px;border-radius:8px;margin-top:10px;background:#000}
  .cap{white-space:pre-wrap;font-size:13px;background:#fafafa;border:1px solid #eee;border-radius:8px;padding:8px;margin-top:8px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .btns button{border:0;border-radius:8px;padding:11px 6px;font-size:14px;font-weight:600;background:#eee;color:var(--tx)}
  .btns .pri{background:var(--o);color:#fff}
  .btns .ok{grid-column:1/-1;background:#1a9b55;color:#fff}
  .done{opacity:.55}
  .done .ok{background:#888}
  .tag{font-size:12px;color:var(--mut);margin-top:6px}
  .empty{text-align:center;color:var(--mut);padding:30px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;display:none;z-index:9}
</style>
</head>
<body>
<header>
  <h1>Antrian Shopee Video</h1>
  <p>1) Simpan/Bagikan video 2) Salin caption 3) Unggah di Shopee Video & tandai produk 4) Klik "Sudah diunggah"</p>
  <div class="tabs">
    <button id="tBelum" class="on">Belum</button>
    <button id="tSudah">Sudah</button>
  </div>
</header>
<main id="list"><div class="empty">Memuat…</div></main>
<div id="toast"></div>
<script>
const KEY='shopeeVideoSudah';
let sudah={};try{sudah=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function simpanStatus(){try{localStorage.setItem(KEY,JSON.stringify(sudah))}catch(e){}}
let data=[],tab='belum';
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2200)};
function caption(p){
  let c=(p.capfb||'').replace(/Cek (di sini|link di bio)[^\n]*/gi,'').replace(/\(link affiliate\):?/gi,'').replace(/https?:\/\/\S+/g,'').replace(/[ \t:]+$/gm,'').replace(/\n{3,}/g,'\n\n').trim();
  if(c.length<25)c=p.nama+(p.terjual?', terjual '+p.terjual+' di Shopee!':'');
  return c+(p.tag?'\n\n'+p.tag:'');
}
async function ambilVideo(p){
  toast('Mengunduh video…');
  const r=await fetch(p.video);if(!r.ok)throw new Error('gagal unduh');
  const b=await r.blob();return new File([b],'kode-'+p.kode+'.mp4',{type:'video/mp4'});
}
async function simpan(p){
  try{const f=await ambilVideo(p);const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Video tersimpan di galeri/unduhan')}
  catch(e){toast('Gagal: '+e.message)}
}
async function bagikan(p){
  try{const f=await ambilVideo(p);
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:caption(p)})}
    else{toast('HP tidak mendukung bagikan, pakai Simpan')}}
  catch(e){if(e.name!=='AbortError')toast('Gagal: '+e.message)}
}
async function salin(p){
  try{await navigator.clipboard.writeText(caption(p));toast('Caption disalin')}
  catch(e){toast('Tidak bisa menyalin otomatis')}
}
function tandai(p){
  if(sudah[p.kode]){delete sudah[p.kode]}else{sudah[p.kode]=new Date().toISOString().slice(0,10)}
  simpanStatus();render();toast(sudah[p.kode]?'Ditandai sudah ('+p.kode+')':'Dikembalikan ke Belum');
}
function render(){
  const L=document.getElementById('list');L.innerHTML='';
  const items=data.filter(p=>tab==='sudah'?sudah[p.kode]:!sudah[p.kode]);
  if(!items.length){L.innerHTML='<div class="empty">'+(tab==='sudah'?'Belum ada yang ditandai.':'Semua sudah diunggah 🎉')+'</div>';return}
  for(const p of items){
    const c=document.createElement('div');c.className='card'+(sudah[p.kode]?' done':'');
    c.innerHTML=`<div class="top"><img loading="lazy" src="${p.foto||''}" alt=""><div><div class="kode">KODE ${p.kode}${sudah[p.kode]?' · diunggah '+sudah[p.kode]:''}</div><div class="nama"></div><div class="tag">Tandai produk ini di Shopee Video</div></div></div>
      <video preload="none" controls playsinline src="${p.video}"></video>
      <div class="cap"></div>
      <div class="btns"><button class="pri b1">Bagikan video</button><button class="b2">Simpan video</button><button class="b3" style="grid-column:1/-1">Salin caption</button><button class="ok b4">${sudah[p.kode]?'Batalkan tanda':'Sudah diunggah ✓'}</button></div>`;
    c.querySelector('.nama').textContent=p.nama;
    c.querySelector('.cap').textContent=caption(p);
    c.querySelector('.b1').onclick=()=>bagikan(p);
    c.querySelector('.b2').onclick=()=>simpan(p);
    c.querySelector('.b3').onclick=()=>salin(p);
    c.querySelector('.b4').onclick=()=>tandai(p);
    L.appendChild(c);
  }
}
document.getElementById('tBelum').onclick=()=>{tab='belum';document.getElementById('tBelum').className='on';document.getElementById('tSudah').className='';render()};
document.getElementById('tSudah').onclick=()=>{tab='sudah';document.getElementById('tSudah').className='on';document.getElementById('tBelum').className='';render()};
fetch('produk.json?t='+Date.now()).then(r=>r.json()).then(j=>{
  data=(Array.isArray(j)?j:[]).filter(p=>p.video&&/Terposting/i.test(p.status||'')).sort((a,b)=>b.kode-a.kode);
  render();
}).catch(()=>{document.getElementById('list').innerHTML='<div class="empty">Gagal memuat produk.json</div>'});
</script>
</body>
</html>
